openapi: 3.1.0
info:
  title: C2-M3 Technical Users
  version: 0.2.0
  description: |
    Manages, in the Portal IAM of the OSP, the technical users of the companies
    (client with service account) with wallet access as a property; disables and
    re-enables them together with their company. The behaviour of every operation is
    described in README.md, sections 6 to 9.

    - People call the paths with tag `Company` and `OSP` over HTTP, with
      their token from the Portal IAM. The required permission is given per operation
      in `x-permission`, the scope in `x-permission-scope` (FRAMEWORK 4.3):
      `company` = only the company from `company_id` in the token, equal to
      `{companyId}` in the path; `osp` = OSP staff, all companies.
    - Process Orchestration and other modules call the paths under `/steps` and
      `/internal` in the same process through the public interface of the module.
      The HTTP form applies when the module runs as a separate service.
    - Secrets appear only in the responses that create them (create, rotate
      secret), never in events or step results. The credentials of a
      wallet account are handed out by C4-M2, not by this module.
    - Errors as Problem Details (RFC 9457), identifiers in README section 12;
      for steps with `retryable`.
    - The events of the module are under `components/schemas` (names start
      with `Event`), see README section 10.
servers:
  - url: /api/c2-m3
security:
  - portalIam: []
tags:
  - name: Company
    description: Calls by people of a company
  - name: OSP
    description: Tasks of the OSP staff
  - name: Queries
    description: For other modules
  - name: Steps
    description: For Process Orchestration

paths:
  /companies/{companyId}/technical-users:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Company]
      operationId: listTechnicalUsers
      summary: List the technical users visible to the company
      description: |
        README 7.1. Accounts of the company and accounts it co-views.
        Sorted by createdAt descending. Without the filter `status`, PENDING,
        ACTIVE and PENDING_DELETION apply. Entries without roles.
      x-permission: view_technical_users
      x-permission-scope: company
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/WalletAccessFilter'
      responses:
        '200':
          description: One page of the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUserPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Company]
      operationId: createTechnicalUser
      summary: Create a technical user
      description: |
        README 7.2. The response contains the secret exactly once. With a
        wallet role, the account is first PENDING with wallet access REQUESTED; the
        module reports WalletAccessRequested. Only for companies that are
        ACTIVE in C3-M1 and have a BPN.
      x-permission: manage_technical_users
      x-permission-scope: company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TechnicalUserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUserWithCredentials' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /companies/{companyId}/technical-users/assignable-roles:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Company]
      operationId: listAssignableRoles
      summary: Roles that the company can assign
      description: README 6.5 and 7.8.
      x-permission: view_technical_users
      x-permission-scope: company
      parameters:
        - name: lang
          in: query
          description: Language of the description (attribute description.{lang}); otherwise the field description of the role.
          schema: { type: string, pattern: '^[a-z]{2}$', default: de, examples: [de, en] }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignableRole' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /companies/{companyId}/technical-users/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Company]
      operationId: getTechnicalUser
      summary: Details of a technical user, with roles, without secret
      description: README 7.3.
      x-permission: view_technical_users
      x-permission-scope: company
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUser' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Company]
      operationId: updateTechnicalUser
      summary: Change name, description or roles
      description: |
        README 7.4. Only the owner, only with status ACTIVE and not disabled.
        The wallet role cannot be added or removed.
      x-permission: manage_technical_users
      x-permission-scope: company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TechnicalUserUpdate' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUser' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Company]
      operationId: deleteTechnicalUser
      summary: Delete a technical user
      description: |
        README 7.5. Owner or co-viewing company. Without active
        wallet access, deleted immediately (204). With wallet access, the module reports
        WalletAccessRemovalRequested; the deletion completes through Process Orchestration
        (202, status PENDING_DELETION).
      x-permission: delete_technical_users
      x-permission-scope: company
      responses:
        '202':
          description: Deletion in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUser' }
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /companies/{companyId}/technical-users/{id}/credentials/rotate:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Company]
      operationId: rotateCredentials
      summary: Create a new secret
      description: |
        README 7.6. Only the owner, only with status ACTIVE or PENDING with a
        created client and not disabled. The old secret is invalid
        afterwards. The response contains the new secret exactly once.
      x-permission: manage_technical_users
      x-permission-scope: company
      responses:
        '200':
          description: New secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /osp/technical-users:
    get:
      tags: [OSP]
      operationId: listAllTechnicalUsers
      summary: List the technical users of all companies
      description: |
        README 7.9. Like listTechnicalUsers across all companies, with the filters
        companyId and disabled; viewerRole is OSP.
      x-permission: view_all_technical_users
      x-permission-scope: osp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: companyId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/WalletAccessFilter'
        - name: disabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: One page of the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUserPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /osp/technical-users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [OSP]
      operationId: getAnyTechnicalUser
      summary: Details of any technical user, without secret
      description: README 7.10. viewerRole is OSP.
      x-permission: view_all_technical_users
      x-permission-scope: osp
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUser' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /internal/technical-users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Queries]
      operationId: checkTechnicalUser
      summary: Check whether an account can be used for a connector
      description: README 9.1. Also responds with 200 and exists false for an unknown ID.
      x-permission: query_c2_m3
      x-permission-scope: osp
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: offerSubscriptionId
          in: query
          required: false
          description: Connector as a service (C6-M1 7.3); the customer account of this subscription is then usable as well.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Result of the check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicalUserCheck' }
        '403': { $ref: '#/components/responses/Problem' }

  /internal/technical-users/{id}/credentials/rotate:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Queries]
      operationId: rotateSubscriptionCredentials
      summary: Rotate the secret of a subscription account, to pass it on to the provider
      description: |
        README 9.2. For Subscriptions. Not a pure query: creates a new secret,
        an earlier one is no longer valid afterwards. Only for accounts with origin SUBSCRIPTION
        and the given offerSubscriptionId, not disabled.
      x-permission: rotate_subscription_credentials
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCredentialsRequest' }
      responses:
        '200':
          description: New secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credentials' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /internal/technical-roles:
    get:
      tags: [Queries]
      operationId: listTechnicalRoles
      summary: All technical user roles, for the profiles of offers
      description: |
        README 9.3. For Offers. All roles on the client TECHNICAL_ROLES_CLIENT,
        independent of company roles.
      x-permission: query_c2_m3
      x-permission-scope: osp
      parameters:
        - name: lang
          in: query
          description: Language of the description (attribute description.{lang}); otherwise the field description of the role.
          schema: { type: string, pattern: '^[a-z]{2}$', default: de, examples: [de, en] }
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssignableRole' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /steps/create-for-subscription:
    post:
      tags: [Steps]
      operationId: stepCreateForSubscription
      summary: 'Step: create the accounts for a subscription'
      description: |
        README 8.1. Preconditions: customer (and, with provider-only roles, the
        provider) active with BPN; roles exist. Creates the customer account and, with
        provider-only roles, a provider account. The result contains only IDs, no
        credentials; Subscriptions creates the secret when passing it on, through
        /internal/technical-users/{id}/credentials/rotate. Idempotent through
        offerSubscriptionId and subscription party.
      x-permission: execute_steps_c2_m3
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepCreateForSubscription' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultCreateForSubscription' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /steps/apply-wallet-access:
    post:
      tags: [Steps]
      operationId: stepApplyWalletAccess
      summary: 'Step: apply the result of the wallet access'
      description: |
        README 8.2. Precondition: technical user with wallet REQUESTED;
        C4-M2 has reported WalletAccountCreated or WalletAccountFailed. For
        outcome ACTIVE, walletAccountRef is required. No credentials.
      x-permission: execute_steps_c2_m3
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepApplyWalletAccess' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultTechnicalUser' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /steps/delete:
    post:
      tags: [Steps]
      operationId: stepDelete
      summary: 'Step: delete the account in the Portal IAM after the wallet account has been deleted'
      description: |
        README 8.3. Precondition: status PENDING_DELETION with wallet REMOVING;
        C4-M2 has reported WalletAccountDeleted. A client that is already deleted counts as
        success.
      x-permission: execute_steps_c2_m3
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepTechnicalUserRef' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultTechnicalUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /steps/disable-company-technical-users:
    post:
      tags: [Steps]
      operationId: stepDisableCompanyTechnicalUsers
      summary: 'Step: disable the technical users of a deactivated company'
      description: |
        README 8.4. Precondition: company deactivated (CompanyDeactivated).
        Clients in the Portal IAM disabled, not deleted; accounts on which the
        company is only co-viewing remain. Idempotent through companyId. No event.
      x-permission: execute_steps_c2_m3
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepCompanyRef' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultCompanyTechnicalUsers' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /steps/enable-company-technical-users:
    post:
      tags: [Steps]
      operationId: stepEnableCompanyTechnicalUsers
      summary: 'Step: re-enable the technical users of a reactivated company'
      description: |
        README 8.5. Precondition: company reactivated (CompanyReactivated).
        Secret, roles and wallet access remain unchanged. Idempotent through
        companyId. No event.
      x-permission: execute_steps_c2_m3
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepCompanyRef' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultCompanyTechnicalUsers' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /steps/disable-subscription-technical-users:
    post:
      tags: [Steps]
      operationId: stepDisableSubscriptionTechnicalUsers
      summary: 'Step: deactivate the technical users of an ended or declined subscription'
      description: |
        README 8.6. Precondition: SubscriptionDeactivated or SubscriptionDeclined.
        Customer and provider account become INACTIVE (final), their clients are
        disabled in the Portal IAM. Idempotent through offerSubscriptionId. No event.
      x-permission: execute_steps_c2_m3
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepSubscriptionRef' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultSubscriptionTechnicalUsers' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    portalIam:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token of the OSP's Portal IAM (only for calls over HTTP). For people with
        `sub`, `company_id` (only for a bound account) and the permissions on the
        client portal-core (FRAMEWORK 4.2).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Company; equal to `company_id` in the token, otherwise 404.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StatusFilter:
      name: status
      in: query
      description: Can be given several times.
      schema:
        type: array
        items: { $ref: '#/components/schemas/Status' }
      style: form
      explode: true
    OriginFilter:
      name: origin
      in: query
      schema: { $ref: '#/components/schemas/Origin' }
    WalletAccessFilter:
      name: walletAccess
      in: query
      schema: { $ref: '#/components/schemas/WalletAccessStatus' }

  responses:
    Problem:
      description: Error (RFC 9457), identifiers in README section 12
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Status:
      type: string
      description: INACTIVE = account of an ended or declined subscription (README 8.6); final.
      enum: [PENDING, ACTIVE, INACTIVE, PENDING_DELETION, DELETED]
    Origin:
      type: string
      description: OWN = created by a person of the company; SUBSCRIPTION = created for a subscription (README 8.1).
      enum: [OWN, SUBSCRIPTION]
    SubscriptionParty:
      type: string
      description: For origin SUBSCRIPTION; CUSTOMER = account of the customer, PROVIDER = account of the provider with the provider-only roles.
      enum: [CUSTOMER, PROVIDER]
    WalletAccessStatus:
      type: string
      enum: [NONE, REQUESTED, ACTIVE, FAILED, REMOVING]
    AuthMethod:
      type: string
      enum: [SECRET]
    ViewerRole:
      type: string
      description: |
        OWNER = the account belongs to the company from the path; CO_VIEWER = the
        company is co-viewing; OSP = view of the OSP staff.
      enum: [OWNER, CO_VIEWER, OSP]

    RoleRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Name of the role on the client `technical_roles_management`.
          examples: [Dataspace Discovery]

    AssignableRole:
      type: object
      required: [name, grantsWalletAccess, providerOnly]
      properties:
        name: { type: string }
        description:
          type: [string, 'null']
          description: Attribute description.{lang} of the role, otherwise its field description.
        grantsWalletAccess:
          type: boolean
          description: Wallet role; leads to a wallet access instead of a role in the Portal IAM.
        providerOnly:
          type: boolean
          description: Provider-only role; in subscriptions, it goes into a separate account of the provider.

    TechnicalUserSummary:
      type: object
      required: [id, companyId, name, origin, status, iamClientId, walletAccess, disabled, viewerRole]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        origin: { $ref: '#/components/schemas/Origin' }
        offerSubscriptionId: { type: [string, 'null'], format: uuid }
        subscriptionParty:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionParty'
            - type: 'null'
        coViewerCompanyId: { type: [string, 'null'], format: uuid }
        viewerRole: { $ref: '#/components/schemas/ViewerRole' }
        status: { $ref: '#/components/schemas/Status' }
        iamClientId:
          type: string
          description: Client ID in the Portal IAM, for example sa123.
        walletAccess: { $ref: '#/components/schemas/WalletAccessStatus' }
        disabled:
          type: boolean
          description: true as long as the owner's company is deactivated; the client is then disabled (README 6.2).
        createdAt: { type: string, format: date-time }
        changedAt: { type: string, format: date-time }

    TechnicalUser:
      allOf:
        - $ref: '#/components/schemas/TechnicalUserSummary'
        - type: object
          required: [roles, authMethod]
          properties:
            authMethod: { $ref: '#/components/schemas/AuthMethod' }
            roles:
              type: array
              description: Read from the Portal IAM. If walletAccess is not NONE, the wallet role is also listed here.
              items: { $ref: '#/components/schemas/RoleRef' }
            walletAccountRef:
              type: [string, 'null']
              description: |
                Identifier of the wallet account at C4-M2, for wallet ACTIVE. A person
                of the company retrieves the credentials of the wallet account
                once from C4-M2.

    TechnicalUserPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TechnicalUserSummary' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    TechnicalUserCreate:
      type: object
      required: [name, roles]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 255 }
        authMethod: { $ref: '#/components/schemas/AuthMethod' }
        roles:
          type: array
          minItems: 1
          description: May contain a wallet role. Names unique.
          items: { $ref: '#/components/schemas/RoleRef' }

    TechnicalUserUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 255 }
        roles:
          type: array
          minItems: 1
          description: New complete list; the wallet role can neither be added nor removed this way.
          items: { $ref: '#/components/schemas/RoleRef' }

    Credentials:
      type: object
      required: [iamClientId, secret, tokenUrl]
      description: Handed out exactly once and not stored by the module.
      properties:
        iamClientId: { type: string }
        secret: { type: string }
        tokenUrl:
          type: string
          format: uri
          description: Token address of the OSP's Portal IAM.

    TechnicalUserWithCredentials:
      allOf:
        - $ref: '#/components/schemas/TechnicalUser'
        - type: object
          required: [credentials]
          properties:
            credentials: { $ref: '#/components/schemas/Credentials' }

    SubscriptionCredentialsRequest:
      type: object
      required: [offerSubscriptionId]
      additionalProperties: false
      properties:
        offerSubscriptionId:
          type: string
          format: uuid
          description: Subscription to which the account must belong.

    TechnicalUserCheck:
      type: object
      required: [exists, usableForConnector]
      properties:
        exists: { type: boolean }
        belongsToCompany: { type: boolean }
        status: { $ref: '#/components/schemas/Status' }
        origin: { $ref: '#/components/schemas/Origin' }
        walletAccess: { $ref: '#/components/schemas/WalletAccessStatus' }
        disabled: { type: boolean }
        usableForConnector:
          type: boolean
          description: |
            true if the account belongs to the company, is ACTIVE or PENDING, is not disabled
            and has origin OWN; with offerSubscriptionId also the customer account of this
            subscription (README 9.1).

    StepRequest:
      type: object
      required: [processId, stepRunId]
      properties:
        processId:
          type: string
          format: uuid
          description: Flow in Process Orchestration; only for the audit log.
        stepRunId:
          type: string
          format: uuid
          description: This execution of the step; only for the audit log.

    StepCreateForSubscription:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [customerCompanyId, providerCompanyId, offerSubscriptionId, name, roles]
          properties:
            customerCompanyId: { type: string, format: uuid }
            providerCompanyId: { type: string, format: uuid }
            offerSubscriptionId: { type: string, format: uuid }
            name:
              type: string
              minLength: 1
              maxLength: 200
              description: Name from the profile or name of the offer; the account is called {client ID}-{name}.
            roles:
              type: array
              minItems: 1
              description: Roles from the profile of the offer; split into wallet roles, provider-only roles and other roles.
              items: { $ref: '#/components/schemas/RoleRef' }

    StepApplyWalletAccess:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [technicalUserId, outcome]
          properties:
            technicalUserId: { type: string, format: uuid }
            outcome:
              type: string
              enum: [ACTIVE, FAILED]
            walletAccountRef:
              type: string
              description: Identifier of the wallet account at C4-M2; required for ACTIVE.

    StepTechnicalUserRef:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [technicalUserId]
          properties:
            technicalUserId: { type: string, format: uuid }

    StepCompanyRef:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [companyId]
          properties:
            companyId: { type: string, format: uuid }

    StepSubscriptionRef:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [offerSubscriptionId]
          properties:
            offerSubscriptionId: { type: string, format: uuid }

    StepResult:
      type: object
      required: [stepRunId, state, result]
      properties:
        stepRunId: { type: string, format: uuid }
        state:
          type: string
          description: Common contract of the steps (FRAMEWORK 4.4). All steps of this module respond with DONE.
          enum: [DONE, RUNNING]

    SubscriptionAccount:
      type: object
      required: [technicalUserId, subscriptionParty, iamClientId, status, walletAccess, roles]
      description: One account of a subscription, without credentials.
      properties:
        technicalUserId: { type: string, format: uuid }
        subscriptionParty: { $ref: '#/components/schemas/SubscriptionParty' }
        iamClientId: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        walletAccess: { $ref: '#/components/schemas/WalletAccessStatus' }
        roles:
          type: array
          description: Roles from the input that this account receives (for the customer account including the wallet role).
          items: { $ref: '#/components/schemas/RoleRef' }

    StepResultCreateForSubscription:
      allOf:
        - $ref: '#/components/schemas/StepResult'
        - type: object
          properties:
            result:
              type: object
              required: [offerSubscriptionId, accounts]
              properties:
                offerSubscriptionId: { type: string, format: uuid }
                accounts:
                  type: array
                  items: { $ref: '#/components/schemas/SubscriptionAccount' }

    StepResultTechnicalUser:
      allOf:
        - $ref: '#/components/schemas/StepResult'
        - type: object
          properties:
            result:
              type: object
              required: [technicalUserId, status, walletAccess]
              properties:
                technicalUserId: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/Status' }
                walletAccess: { $ref: '#/components/schemas/WalletAccessStatus' }
                walletAccountRef: { type: [string, 'null'] }

    StepResultCompanyTechnicalUsers:
      allOf:
        - $ref: '#/components/schemas/StepResult'
        - type: object
          properties:
            result:
              type: object
              required: [companyId, technicalUserIds]
              properties:
                companyId: { type: string, format: uuid }
                technicalUserIds:
                  type: array
                  description: |
                    disable-company-technical-users: all accounts of the company
                    (status other than DELETED) with disabled true; enable-company-technical-users:
                    all with disabled false.
                  items: { type: string, format: uuid }

    StepResultSubscriptionTechnicalUsers:
      allOf:
        - $ref: '#/components/schemas/StepResult'
        - type: object
          properties:
            result:
              type: object
              required: [offerSubscriptionId, technicalUserIds]
              properties:
                offerSubscriptionId: { type: string, format: uuid }
                technicalUserIds:
                  type: array
                  description: All accounts of the subscription with status INACTIVE.
                  items: { type: string, format: uuid }

    EventBase:
      type: object
      required: [eventId, eventType, occurredAt]
      description: Common fields of every event. Events never contain secrets.
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }

    EventTechnicalUserCreated:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [technicalUserId, companyId, origin, iamClientId]
          properties:
            eventType: { const: TechnicalUserCreated }
            technicalUserId: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            origin: { $ref: '#/components/schemas/Origin' }
            offerSubscriptionId: { type: [string, 'null'], format: uuid }
            subscriptionParty:
              oneOf:
                - $ref: '#/components/schemas/SubscriptionParty'
                - type: 'null'
            coViewerCompanyId: { type: [string, 'null'], format: uuid }
            iamClientId: { type: string }

    EventTechnicalUserDeleted:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [technicalUserId, companyId, iamClientId]
          properties:
            eventType: { const: TechnicalUserDeleted }
            technicalUserId: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            coViewerCompanyId: { type: [string, 'null'], format: uuid }
            iamClientId: { type: string }

    EventWalletAccessRequested:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [technicalUserId, companyId]
          properties:
            eventType: { const: WalletAccessRequested }
            technicalUserId: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            offerSubscriptionId:
              type: [string, 'null']
              format: uuid
              description: For subscription accounts, the subscription, so that the subscription flow can match the event.

    EventWalletAccessRemovalRequested:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [technicalUserId, companyId, walletAccountRef]
          properties:
            eventType: { const: WalletAccessRemovalRequested }
            technicalUserId: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            walletAccountRef: { type: string }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Identifier, for example urn:c2-m3:problem:role-not-assignable (list in README section 12).
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        retryable:
          type: boolean
          description: Only for steps; true = temporary, false = permanent (FRAMEWORK 4.4).
