openapi: 3.1.0
info:
  title: C4-M1 Credentials
  version: 0.2.0
  description: |
    Triggers the BPN credential and the membership credential of a company at the issuer,
    tracks their status and revokes the membership credential. The credentials themselves are
    in the company's dataspace wallet. The behaviour is described in README.md.

    - Issuer by configuration (ISSUER_MODE): own issuer of the OSP (Credential
      Issuer or IssuerService) or CSP issuer. Status reports arrive through
      `/issuer-callbacks`; the module does not poll.
    - People call through the user interface with their token from the OSP's Portal IAM.
      Required permission per operation in `x-permission`, scope in
      `x-permission-scope` (FRAMEWORK 4.3).
    - Process Orchestration and other modules call steps (`/steps`) and queries
      (`/internal`) in the same process. The HTTP paths describe the same contract.
    - Errors as Problem Details (RFC 9457), identifiers in README section 12.
    - Events under `components/schemas` (names start with `Event`), README section 10.
servers:
  - url: /api/c4-m1
security:
  - portalIam: []
tags:
  - name: Company
    description: Calls by people of a company
  - name: OSP
    description: Tasks of OSP staff
  - name: Issuer
    description: Status reports of the issuers and callback adapters (service accounts)
  - name: Queries
    description: For other modules
  - name: Steps
    description: For Process Orchestration

paths:
  /companies/{companyId}/credentials:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Company]
      operationId: listCompanyCredentials
      summary: Status of the credentials of the own company
      description: |
        README 7.1. companyId must equal company_id in the token, otherwise 404. Per
        credential type, status and times. Types from ONBOARDING_CREDENTIAL_TYPES without
        an order appear with status NONE.
      x-permission: view_credentials
      x-permission-scope: company
      responses:
        '200':
          description: Status per credential type
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CredentialStatusView' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /credentials:
    get:
      tags: [OSP]
      operationId: listCredentials
      summary: Search the credentials of all companies of the installation
      description: README 7.2. Sorted by changedAt descending.
      x-permission: manage_credentials
      x-permission-scope: osp
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          description: May be repeated.
          schema:
            type: array
            items: { $ref: '#/components/schemas/CredentialStatus' }
          style: form
          explode: true
        - name: credentialType
          in: query
          schema: { $ref: '#/components/schemas/CredentialType' }
        - name: companyId
          in: query
          schema: { type: string, format: uuid }
        - name: route
          in: query
          schema: { $ref: '#/components/schemas/Route' }
        - name: requestedBefore
          in: query
          description: Only orders that were sent before this time.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One page of the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /credentials/{credentialId}/confirm-revocation:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [OSP]
      operationId: confirmRevocation
      summary: Confirm a revocation done by hand at the Credential Issuer
      description: |
        README 7.3. REVOCATION_PENDING becomes REVOKED, event CredentialRevoked,
        audit log entry with sub of the person. REVOKED stays without a change.
      x-permission: manage_credentials
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Note on the revocation at the Credential Issuer, for example date and ticket. No names.
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /issuer-callbacks/{credentialKind}:
    parameters:
      - name: credentialKind
        in: path
        required: true
        description: bpn = BPN credential; membership = membership credential.
        schema:
          type: string
          enum: [bpn, membership]
    post:
      tags: [Issuer]
      operationId: reportCredentialStatus
      summary: Status report for a credential
      description: |
        README 7.4. Called by the service account of an issuer or callback adapter
        (own Credential Issuer, callback adapter in the own IdentityHub, dataspace wallet
        of the CSP, CSP issuer). Body as in today's portal. Assignment by BPN and
        credential type. Duplicate reports change nothing.
      x-permission: report_credential_status
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuerResponse' }
      responses:
        '204':
          description: Processed
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /internal/companies/{companyId}/credentials:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Queries]
      operationId: queryCompanyCredentials
      summary: Status of the credentials of a company
      description: README 9.1. An unknown company gives an empty list.
      x-permission: query_c4_m1
      x-permission-scope: osp
      responses:
        '200':
          description: Status per credential type and last round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyCredentialsInternal' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /steps/issue-credentials:
    post:
      tags: [Steps]
      operationId: stepIssueCredentials
      summary: 'Step: trigger credentials at the issuer (long-running)'
      description: |
        README 8.1. Onboarding after CompanyDidRegistered; reactivation after
        CompanyReactivated with credentialTypes [MEMBERSHIP]. Triggers every credential type that
        is not issued and has no recent open order. RUNNING until the
        status report; ends with CredentialsIssued or CredentialIssuanceFailed.
      x-permission: execute_steps_c4_m1
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepIssueCredentials' }
      responses:
        '200':
          description: DONE or RUNNING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultCredentials' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /steps/revoke-credentials:
    post:
      tags: [Steps]
      operationId: stepRevokeCredentials
      summary: 'Step: revoke the membership credential'
      description: |
        README 8.2. Deactivation after CompanyDeactivated. Without credentialTypes, only the
        membership credential; the BPN credential stays. Issued credentials are
        revoked or, if the route cannot do that, set to REVOCATION_PENDING;
        open orders become CANCELLED.
      x-permission: execute_steps_c4_m1
      x-permission-scope: osp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepRevokeCredentials' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepResultRevocation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    portalIam:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token of the OSP's Portal IAM. People: with sub, company_id (if bound to a
        company) and the permissions. Issuers and callback adapters:
        service accounts with exactly the permission report_credential_status. For calls in the same
        process, there is no token.

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Problem:
      description: Error (RFC 9457), identifiers in README section 12
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    CredentialType:
      type: string
      description: BPN = BpnCredential; MEMBERSHIP = MembershipCredential.
      enum: [BPN, MEMBERSHIP]

    CredentialStatus:
      type: string
      description: |
        REQUESTED = triggered at the issuer; ISSUED = issued; FAILED = failed;
        CANCELLED = order cancelled; REVOCATION_PENDING = revocation by hand at the
        Credential Issuer needed; REVOKED = revoked.
      enum: [REQUESTED, ISSUED, FAILED, CANCELLED, REVOCATION_PENDING, REVOKED]

    Route:
      type: string
      description: |
        Route of the order (README 6.3). CREDENTIAL_ISSUER and ISSUER_SERVICE = own
        issuer of the OSP; CSP_ISSUER = CSP issuer; STUB = built-in stand-in.
      enum: [CREDENTIAL_ISSUER, ISSUER_SERVICE, CSP_ISSUER, STUB]

    WalletProvider:
      type: string
      description: |
        Wallet provider according to C4-M2 (field provider). CSP = dataspace wallet of the CSP;
        BRING_YOUR_OWN = own wallet (later); STUB only in the built-in stand-in of C4-M2.
      enum: [SAP_DIV, IDENTITY_HUB, CSP, BRING_YOUR_OWN, STUB]

    RunStatus:
      type: string
      description: Status of the issuance round (README 6.2).
      enum: [RUNNING, DONE, FAILED, CANCELLED]

    Bpn:
      type: string
      description: Company identifier, today BPN (BPNL).
      pattern: '^[Bb][Pp][Nn][Ll][A-Za-z0-9]{12}$'
      examples: [BPNLIUK2REMLK3F4]

    CredentialStatusView:
      type: object
      description: View of the people of the company, without messages of the issuer and without route.
      required: [credentialType, status]
      properties:
        credentialType: { $ref: '#/components/schemas/CredentialType' }
        status:
          type: string
          description: NONE = there has been no order for this type yet.
          enum: [NONE, REQUESTED, ISSUED, FAILED, CANCELLED, REVOCATION_PENDING, REVOKED]
        requestedAt: { type: [string, 'null'], format: date-time }
        issuedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }

    CredentialDetail:
      type: object
      description: View of OSP staff, without secrets.
      required: [id, companyId, credentialType, status, route, attempt, createdAt, changedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        credentialType: { $ref: '#/components/schemas/CredentialType' }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        route: { $ref: '#/components/schemas/Route' }
        issuerDid:
          type: [string, 'null']
          description: DID of the issuer at the last order; empty for CREDENTIAL_ISSUER and STUB.
        walletProvider: { $ref: '#/components/schemas/WalletProvider' }
        bpn: { $ref: '#/components/schemas/Bpn' }
        holderDid: { type: string }
        requestRef: { type: [string, 'null'] }
        attempt: { type: integer, minimum: 1 }
        requestedAt: { type: [string, 'null'], format: date-time }
        issuedAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'], maxLength: 1000 }
        revocationReason:
          oneOf:
            - $ref: '#/components/schemas/RevocationReason'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        changedAt: { type: string, format: date-time }

    CredentialPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CredentialDetail' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    IssuerResponse:
      type: object
      description: Status report as in today's portal (IssuerResponseData); the same for all senders.
      required: [bpn, status]
      properties:
        bpn: { $ref: '#/components/schemas/Bpn' }
        status:
          type: string
          enum: [SUCCESSFUL, UNSUCCESSFUL]
        message:
          type: [string, 'null']
          description: Message of the issuer; stored truncated to 1000 characters.

    CompanyCredentialsInternal:
      type: object
      required: [companyId, credentials]
      properties:
        companyId: { type: string, format: uuid }
        credentials:
          type: array
          items:
            type: object
            required: [credentialType, status]
            properties:
              credentialType: { $ref: '#/components/schemas/CredentialType' }
              status: { $ref: '#/components/schemas/CredentialStatus' }
              requestedAt: { type: [string, 'null'], format: date-time }
              issuedAt: { type: [string, 'null'], format: date-time }
              revokedAt: { type: [string, 'null'], format: date-time }
        run:
          description: Last issuance round; empty if there was none.
          oneOf:
            - type: object
              required: [status, credentialTypes, startedAt]
              properties:
                status: { $ref: '#/components/schemas/RunStatus' }
                credentialTypes:
                  type: array
                  items: { $ref: '#/components/schemas/CredentialType' }
                startedAt: { type: string, format: date-time }
                finishedAt: { type: [string, 'null'], format: date-time }
            - type: 'null'

    RevocationReason:
      type: string
      enum: [COMPANY_DEACTIVATED, OTHER]

    StepRequest:
      type: object
      required: [processId, stepRunId]
      properties:
        processId:
          type: string
          format: uuid
          description: Process in Process Orchestration; for the audit log only.
        stepRunId:
          type: string
          format: uuid
          description: This run of the step; for the audit log only.

    StepIssueCredentials:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [companyId]
          properties:
            companyId: { type: string, format: uuid }
            credentialTypes:
              type: array
              minItems: 1
              uniqueItems: true
              description: Default ONBOARDING_CREDENTIAL_TYPES; for reactivation [MEMBERSHIP].
              items: { $ref: '#/components/schemas/CredentialType' }

    StepRevokeCredentials:
      allOf:
        - $ref: '#/components/schemas/StepRequest'
        - type: object
          required: [companyId, reason]
          properties:
            companyId: { type: string, format: uuid }
            credentialTypes:
              type: array
              minItems: 1
              uniqueItems: true
              description: Default [MEMBERSHIP]; the BPN credential stays at deactivation (OP-07).
              default: [MEMBERSHIP]
              items: { $ref: '#/components/schemas/CredentialType' }
            reason: { $ref: '#/components/schemas/RevocationReason' }

    StepResult:
      type: object
      required: [stepRunId, state]
      properties:
        stepRunId: { type: string, format: uuid }
        state:
          type: string
          description: DONE = done; RUNNING = long-running step is running, ends with an event.
          enum: [DONE, RUNNING]

    StepResultCredentials:
      allOf:
        - $ref: '#/components/schemas/StepResult'
        - type: object
          required: [result]
          properties:
            result:
              type: object
              required: [companyId, credentials]
              properties:
                companyId: { type: string, format: uuid }
                credentials:
                  type: array
                  items:
                    type: object
                    required: [credentialType, status]
                    properties:
                      credentialType: { $ref: '#/components/schemas/CredentialType' }
                      status: { $ref: '#/components/schemas/CredentialStatus' }

    StepResultRevocation:
      allOf:
        - $ref: '#/components/schemas/StepResult'
        - type: object
          required: [result]
          properties:
            state: { const: DONE }
            result:
              type: object
              required: [companyId, revoked, cancelled, manualRevocation]
              properties:
                companyId: { type: string, format: uuid }
                revoked:
                  type: array
                  description: Revoked in this run.
                  items: { $ref: '#/components/schemas/CredentialType' }
                cancelled:
                  type: array
                  description: Open orders cancelled.
                  items: { $ref: '#/components/schemas/CredentialType' }
                manualRevocation:
                  type: array
                  description: Types in status REVOCATION_PENDING; OSP staff revoke at the Credential Issuer and confirm.
                  items: { $ref: '#/components/schemas/CredentialType' }

    EventBase:
      type: object
      required: [eventId, eventType, occurredAt, companyId]
      description: Common fields of every event. Events never contain secrets.
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        companyId: { type: string, format: uuid }

    EventCredentialsIssued:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [credentialTypes]
          properties:
            eventType: { const: CredentialsIssued }
            credentialTypes:
              type: array
              description: All credential types of the round.
              items: { $ref: '#/components/schemas/CredentialType' }

    EventCredentialIssuanceFailed:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [credentialType]
          properties:
            eventType: { const: CredentialIssuanceFailed }
            credentialType: { $ref: '#/components/schemas/CredentialType' }
            reason:
              type: [string, 'null']
              maxLength: 200
              description: Message of the issuer, truncated.

    EventCredentialRevoked:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [credentialType, revocationReason]
          properties:
            eventType: { const: CredentialRevoked }
            credentialType: { $ref: '#/components/schemas/CredentialType' }
            revocationReason: { $ref: '#/components/schemas/RevocationReason' }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Identifier, for example urn:c4-m1:problem:wallet-not-ready (list in README section 12).
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        retryable:
          type: boolean
          description: Only for steps. true = temporary, repeating is worthwhile; false = final (FRAMEWORK 4.4).
